# API 管理系统 生产编排：MySQL(元数据库) + Redis + 应用（gunicorn 多 worker）
# 用法：
#   自带 MySQL/Redis：  docker compose up -d   → http://localhost:8000/admin
# 安全说明（C-5/H-9/H-15）：
#   - MySQL/Redis 端口不再映射到宿主机，仅 app 通过内部网络访问
#   - 凭据一律通过环境变量注入，禁止在文件中写明文（已泄露的旧值须立即轮换）
#   - 复制本文件为 .env 或 export 后填写：MYSQL_ROOT_PASSWORD / MYSQL_PASSWORD /
#     JWT_SECRET(>=32字节随机) / DB_SECRET_KEY(>=32字节随机)
services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD 环境变量}
      MYSQL_DATABASE: api_mgr
      MYSQL_USER: api_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请设置 MYSQL_PASSWORD 环境变量}
    # 不暴露到宿主机，仅内部网络（H-9）
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # 不仅 ping，还要确认应用账号 api_user 已能连上目标库 api_mgr ——
      # 否则 entrypoint 尚未建库/建用户时 mysqladmin ping 就会误报 alive，导致 App 抢跑失败。
      # 用 $$ 让容器运行时从自身环境变量展开（MYSQL_USER/MYSQL_PASSWORD/MYSQL_DATABASE 已在 environment: 定义）。
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" >/dev/null 2>&1 && mysql -h localhost -u \"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -e 'SELECT 1' \"$$MYSQL_DATABASE\""]
      interval: 10s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    # 启用密码 + 禁用危险命令（H-9）：通过命令参数要求认证
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?请设置 REDIS_PASSWORD 环境变量}"]
    # 不暴露到宿主机，仅内部网络（H-9）
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 30

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 内部网络访问，无需暴露端口到宿主机
      METADATA_DB_URL: mysql+aiomysql://api_user:${MYSQL_PASSWORD}@mysql:3306/api_mgr
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      WORKERS: "4"                       # gunicorn 多 worker（跨 worker 状态全在 Redis/MySQL）
      DB_STARTUP_WAIT_SECONDS: "180"     # 启动期等待 MySQL/Redis 就绪的最大秒数（带重试兜底竞态）
      # 生产必须显式设置强随机密钥，否则应用拒绝启动（C-3/C-4）
      JWT_SECRET: ${JWT_SECRET:?请设置 JWT_SECRET 环境变量（>=32字节随机）}
      DB_SECRET_KEY: ${DB_SECRET_KEY:?请设置 DB_SECRET_KEY 环境变量（>=32字节随机）}
      # 生产前置 TLS 反向代理后务必置 1（会话 Cookie 标记 Secure，见避坑 #31）
      COOKIE_SECURE: "0"
      DOCS_ENABLED: "0"                  # 生产关闭 /docs、/redoc、/openapi.json
      CORS_ALLOW_ORIGINS: ""
      CORS_ALLOW_CREDENTIALS: "0"
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  mysql_data:
